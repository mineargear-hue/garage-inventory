<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#F5F4F0">
<title>Garage Inventory — minearproject.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F5F4F0;--bg2:#EEECEA;--bg3:#E5E3DE;--bd:#D0CCC4;
  --acc:#1A5C38;--err:#C0392B;--ok:#1A5C38;
  --tx:#1a1d23;--tx2:#4a5060;--tx3:#8a909e;
  --hi:rgba(26,92,56,0.07);
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;}
.app{max-width:1100px;margin:0 auto;padding:0 12px 100px;}

/* HEADER */
.hdr{display:flex;align-items:center;gap:10px;padding:14px 0 12px;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100;background:var(--bg);}
.logo{display:flex;align-items:center;gap:8px;font-family:'DM Sans',sans-serif;}
.logo-icon{font-size:22px;}
.logo-name{font-size:18px;font-weight:700;letter-spacing:2px;color:var(--acc);line-height:1;}
.logo-sub{font-size:8px;letter-spacing:3px;color:var(--tx3);font-family:'DM Mono',monospace;margin-top:2px;}
.hdr-chips{display:flex;gap:5px;margin-left:8px;}
.chip{font-family:'DM Mono',monospace;font-size:13px;color:var(--tx2);padding:3px 8px;border:1px solid var(--bd);border-radius:3px;}
.chip b{color:var(--acc);}
.hdr-right{margin-left:auto;display:flex;gap:5px;}
.pdf-picker{background:var(--bg2);border:1px solid #1A5C38;border-radius:6px;padding:16px;margin-bottom:8px;}
.pdf-picker-title{font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#1A5C38;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.pdf-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.pdf-chip{font-family:'DM Mono',monospace;font-size:12px;padding:5px 10px;border:1px solid var(--bd);border-radius:4px;cursor:pointer;color:var(--tx2);background:var(--bg3);transition:all .15s;display:flex;align-items:center;gap:5px;}
.pdf-chip:hover{border-color:#1A5C38;color:#1A5C38;}
.pdf-chip.sel{background:#1A5C38;color:#fff;border-color:#1A5C38;}
.pdf-chip.cat-chip.sel{background:#2e7d32;border-color:#2e7d32;}
.pdf-chip .chip-ct{font-size:10px;opacity:.75;}
.pdf-picker-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn-hdr{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:1px;background:transparent;border:1px solid var(--bd);color:var(--tx2);padding:6px 10px;cursor:pointer;border-radius:3px;transition:all .2s;white-space:nowrap;}
.btn-hdr:hover,.btn-hdr:active{border-color:var(--acc);color:var(--acc);}
.btn-hdr.acc{border-color:var(--acc);color:var(--acc);}
.btn-hdr.acc:hover{background:var(--acc);color:#fff;}

/* TABS */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--bd);margin:12px 0 0;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;padding:10px 16px;border:none;background:none;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;white-space:nowrap;flex-shrink:0;}
.tab.active{color:var(--acc);border-bottom-color:var(--acc);}
.tab:not(.active):hover{color:var(--tx);}
.tab.danger{color:var(--tx3);}
.tab.danger.active{color:var(--err);border-bottom-color:var(--err);}
.tab.danger:not(.active):hover{color:var(--err);}

/* IMPORT DROP ZONE */
.drop-zone{border:2px dashed var(--bd);border-radius:8px;padding:28px 20px;text-align:center;margin:14px 0;transition:all .3s;background:var(--bg2);}
.drop-zone.drag-active{border-color:var(--acc);background:rgba(26,92,56,0.04);}
.drop-icon{font-size:30px;margin-bottom:8px;}
.drop-title{font-family:'DM Sans',sans-serif;font-size:16px;font-weight:600;letter-spacing:2px;color:var(--acc);margin-bottom:6px;}
.drop-sub{font-size:13px;color:var(--tx2);margin-bottom:16px;line-height:1.8;}
.drop-sub em{color:var(--tx3);}
.btn-upload{position:relative;display:inline-block;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:var(--acc);color:#fff;padding:10px 24px;border-radius:4px;cursor:pointer;overflow:hidden;transition:background .2s;}
.btn-upload input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;}
.btn-upload:hover{background:#0F3D25;}
.btn-text{background:none;border:none;color:var(--acc);cursor:pointer;font-size:13px;text-decoration:underline;font-family:'DM Sans',sans-serif;}
.import-links{margin-top:12px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:14px 0 10px;}
.stat{background:var(--bg2);border:1px solid var(--bd);border-radius:5px;padding:10px 12px;}
.stat-val{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:600;color:var(--acc);}
.stat-lbl{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--tx3);margin-top:2px;}

/* FILTERS */
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;}
.filters .inp{flex:1;min-width:180px;}
.filters select{min-width:140px;}
.btn-clear{font-size:13px;color:var(--tx3);background:none;border:1px solid var(--bd);padding:8px 12px;border-radius:4px;cursor:pointer;white-space:nowrap;transition:all .2s;}
.btn-clear:hover{color:var(--tx);border-color:var(--tx);}

/* BULK BAR */
.bulk-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;background:var(--bg3);border:1px solid var(--bd);border-radius:4px;padding:8px 12px;margin-bottom:8px;font-size:13px;color:var(--tx2);}
.btn-sm-danger{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--err);color:var(--err);background:transparent;padding:5px 10px;border-radius:3px;cursor:pointer;transition:all .2s;}
.btn-sm-danger:hover,.btn-sm-danger:active{background:var(--err);color:#fff;}
.btn-sm{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:1px;text-transform:uppercase;border:1px solid var(--bd);color:var(--tx2);background:transparent;padding:5px 10px;border-radius:3px;cursor:pointer;transition:all .2s;}
.btn-sm:hover{border-color:var(--tx);color:var(--tx);}

/* TABLE */
.tbl-wrap{overflow-x:auto;border:1px solid var(--bd);border-radius:6px;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;}
thead tr{background:var(--bg3);}
th{font-family:'DM Sans',sans-serif;font-size:13px;letter-spacing:1.5px;color:var(--tx2);text-transform:uppercase;padding:9px 10px;text-align:left;border-bottom:1px solid var(--bd);cursor:pointer;user-select:none;white-space:nowrap;transition:color .2s;}
th:hover,th.sorted{color:var(--acc);}
.arr{font-size:13px;margin-left:2px;opacity:.6;}
tbody tr{border-bottom:1px solid var(--bd);transition:background .15s;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover,tbody tr:active{background:var(--hi);}
tbody tr.sel{background:rgba(26,92,56,0.05);}
td{padding:8px 10px;font-size:13px;vertical-align:middle;color:#111318;}
.td-desc{font-weight:600;color:#000000 !important;}
.td-muted{color:var(--tx2);font-size:13px;}
.td-mono{font-family:'DM Mono',monospace;font-size:13px;color:var(--tx2);}
.badge-cont{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:1px;background:var(--bg3);border:1px solid var(--bd);color:var(--acc);padding:2px 6px;border-radius:2px;white-space:nowrap;}
.badge-cat{font-size:13px;background:transparent;border:1px solid var(--bd);color:var(--tx2);padding:2px 6px;border-radius:10px;white-space:nowrap;}
.row-acts{display:flex;gap:3px;}
.act{font-size:15px;background:none;border:none;cursor:pointer;color:var(--tx3);padding:3px 5px;border-radius:3px;transition:all .15s;}
.act.edit:hover,.act.edit:active{color:var(--acc);}
.act.del:hover,.act.del:active{color:var(--err);}
.empty-row{text-align:center;padding:50px 20px;color:var(--tx3);font-size:13px;}
.empty-row div{font-size:28px;margin-bottom:8px;}
.chk{accent-color:var(--acc);width:14px;height:14px;cursor:pointer;}

/* FORM */
.form-card{background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:20px;margin-top:16px;}
.form-title{font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:18px;}
.form-title.danger{color:var(--err);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fg{display:flex;flex-direction:column;gap:4px;}
.fg.full{grid-column:1/-1;}
label{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--tx2);}
.req{color:#e8531d;}
.form-acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;}
.btn-primary{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:var(--acc);color:#fff;border:none;padding:10px 24px;border-radius:4px;cursor:pointer;transition:all .2s;}
.btn-primary:hover,.btn-primary:active{background:#0F3D25;}
.btn-ghost{font-family:'DM Sans',sans-serif;font-size:13px;letter-spacing:1.5px;text-transform:uppercase;background:none;border:1px solid var(--bd);color:var(--tx2);padding:10px 18px;border-radius:4px;cursor:pointer;transition:all .2s;}
.btn-ghost:hover,.btn-ghost:active{border-color:var(--tx);color:var(--tx);}

/* INPUTS */
.inp{width:100%;background:var(--bg2);border:1px solid var(--bd);color:var(--tx);padding:9px 11px;border-radius:4px;font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s;-webkit-appearance:none;}
.inp:focus{border-color:var(--acc);}
select.inp{cursor:pointer;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;}
.modal{background:var(--bg2);border:1px solid var(--bd);border-radius:6px;padding:24px;max-width:360px;width:100%;}
.modal-title{font-family:'DM Sans',sans-serif;font-size:14px;letter-spacing:2px;color:var(--err);margin-bottom:10px;text-transform:uppercase;}
.modal-body{font-size:13px;color:var(--tx2);margin-bottom:20px;line-height:1.6;}
.modal-acts{display:flex;gap:8px;justify-content:flex-end;}
.btn-del{font-family:'DM Sans',sans-serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;background:var(--err);color:#fff;border:none;padding:9px 20px;border-radius:4px;cursor:pointer;}
.btn-del:hover{background:#c62828;}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:9999;padding:11px 18px;border-radius:4px;font-family:'DM Mono',monospace;font-size:13px;letter-spacing:1px;box-shadow:0 4px 24px rgba(0,0,0,.5);white-space:nowrap;background:var(--bg3);animation:su .25s ease;}
.toast.ok{border-left:3px solid var(--ok);color:var(--tx);}
.toast.err{border-left:3px solid var(--err);color:var(--tx);}
.toast.warn{border-left:3px solid var(--acc);color:var(--tx);}
@keyframes su{from{transform:translateX(-50%) translateY(14px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}

@media(max-width:500px){
  .stats-row{grid-template-columns:1fr 1fr;}
  .form-grid{grid-template-columns:1fr;}
  .hdr-chips{display:none;}
  .logo-name{font-size:15px;}
}
</style>
</head>

<!-- PIN SCREEN -->
<div id="pin-screen" style="position:fixed;inset:0;background:#F5F4F0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;padding:24px;">
  <div style="text-align:center;max-width:320px;width:100%;">
    <div style="font-family:'DM Mono',monospace;font-size:10px;letter-spacing:4px;color:#8a909e;text-transform:uppercase;margin-bottom:6px;">minearproject.com</div>
    <div style="font-family:'DM Sans',sans-serif;font-size:22px;font-weight:700;color:#1A5C38;margin-bottom:4px;">Garage Inventory</div>
    <div style="font-family:'DM Mono',monospace;font-size:11px;color:#8a909e;letter-spacing:2px;margin-bottom:36px;">ENTER PIN TO ACCESS</div>
    <div id="pin-dots" style="display:flex;justify-content:center;gap:14px;margin-bottom:28px;">
      <div class="pdot" style="width:14px;height:14px;border-radius:50%;border:2px solid #D0CCC4;background:transparent;"></div>
      <div class="pdot" style="width:14px;height:14px;border-radius:50%;border:2px solid #D0CCC4;background:transparent;"></div>
      <div class="pdot" style="width:14px;height:14px;border-radius:50%;border:2px solid #D0CCC4;background:transparent;"></div>
      <div class="pdot" style="width:14px;height:14px;border-radius:50%;border:2px solid #D0CCC4;background:transparent;"></div>
    </div>
    <div id="pin-error" style="font-family:'DM Mono',monospace;font-size:11px;color:#C0392B;letter-spacing:2px;min-height:18px;margin-bottom:16px;"></div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
      <button class="pkey" onclick="pinKey('1')">1</button>
      <button class="pkey" onclick="pinKey('2')">2</button>
      <button class="pkey" onclick="pinKey('3')">3</button>
      <button class="pkey" onclick="pinKey('4')">4</button>
      <button class="pkey" onclick="pinKey('5')">5</button>
      <button class="pkey" onclick="pinKey('6')">6</button>
      <button class="pkey" onclick="pinKey('7')">7</button>
      <button class="pkey" onclick="pinKey('8')">8</button>
      <button class="pkey" onclick="pinKey('9')">9</button>
      <button class="pkey" onclick="pinKey('clr')" style="color:#C0392B;">CLR</button>
      <button class="pkey" onclick="pinKey('0')">0</button>
      <button class="pkey" onclick="pinKey('del')" style="color:#C0392B;">⌫</button>
    </div>
  </div>
</div>

<style>
.pkey{font-family:'DM Sans',sans-serif;font-size:20px;font-weight:500;background:#EEECEA;border:1px solid #D0CCC4;border-radius:8px;padding:16px;cursor:pointer;color:#1a1d23;transition:all .15s;-webkit-tap-highlight-color:transparent;}
.pkey:active{background:#D0CCC4;}
</style>

<script>
var pinEntry = '';
var PIN_CORRECT = '2589';
var pinUnlocked = false;

// Check session
if (sessionStorage.getItem('gi-pin') === PIN_CORRECT) {
  document.getElementById('pin-screen').style.display = 'none';
  pinUnlocked = true;
}

function pinKey(k) {
  if (k === 'clr') { pinEntry = ''; }
  else if (k === 'del') { pinEntry = pinEntry.slice(0, -1); }
  else if (pinEntry.length < 4) { pinEntry += k; }
  
  updatePinDots();
  
  if (pinEntry.length === 4) {
    if (pinEntry === PIN_CORRECT) {
      sessionStorage.setItem('gi-pin', PIN_CORRECT);
      document.getElementById('pin-screen').style.display = 'none';
      pinUnlocked = true;
    } else {
      document.getElementById('pin-error').textContent = 'INCORRECT PIN';
      document.querySelectorAll('.pdot').forEach(d => d.style.background = '#C0392B');
      setTimeout(() => {
        pinEntry = '';
        updatePinDots();
        document.getElementById('pin-error').textContent = '';
      }, 800);
    }
  }
}

function updatePinDots() {
  document.querySelectorAll('.pdot').forEach((d, i) => {
    d.style.background = i < pinEntry.length ? '#1A5C38' : 'transparent';
    d.style.borderColor = i < pinEntry.length ? '#1A5C38' : '#D0CCC4';
  });
}
</script>

function matchesItem(item, q) {
  const t = q.toLowerCase();
  return (item.description||'').toLowerCase().includes(t) ||
    (item.containerID||'').toLowerCase().includes(t) ||
    (item.category||'').toLowerCase().includes(t) ||
    (item.brand||'').toLowerCase().includes(t) ||
    (item.notes||'').toLowerCase().includes(t);
}

function commit(newItems) {
  state.items = newItems;
  saveStored(newItems);
}

function subtractQty(id) {
  const toRemove = parseInt(state.removeQty[id]) || 0;
  if (toRemove <= 0) { showToast('Enter a quantity to remove', 'err'); return; }
  const idx = state.items.findIndex(i => i.id === id);
  if (idx === -1) return;
  const current = parseInt(state.items[idx].qty) || 1;
  const remaining = current - toRemove;
  if (remaining <= 0) {
    commit(state.items.filter(i => i.id !== id));
    showToast('Item removed completely');
  } else {
    state.items[idx].qty = String(remaining);
    saveStored(state.items);
    showToast(`Updated: ${remaining} remaining`);
  }
  delete state.removeQty[id];
  render();
}

function showToast(msg, type='ok') {
  clearTimeout(toastTimer);
  state.toast = {msg, type};
  render();
  toastTimer = setTimeout(() => { state.toast = null; render(); }, 3000);
}

function triggerCSV(items) {
  const hdr = ['#','Container ID','Item Description','Category','Area','Brand','Model #','Qty','Est. Value ($)','Notes'];
  const rows = items.map((it,i) =>
    [i+1,it.containerID,it.description,it.category,it.area,it.brand,it.modelNum,it.qty||1,it.estValue,it.notes]
      .map(v => '"' + (v||'').toString().replace(/"/g,'""') + '"').join(',')
  );
  const blob = new Blob([[hdr.join(','),...rows].join('\n')], {type:'text/csv'});
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob),
    download: 'Garage_Inventory_' + new Date().toISOString().slice(0,10) + '.csv'
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(Boolean);
  if (lines.length < 2) return [];
  const parseLine = line => {
    const cols = []; let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQ && line[i+1] === '"') { cur += '"'; i++; }
        else inQ = !inQ;
      } else if (c === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    cols.push(cur.trim()); return cols;
  };
  const header = parseLine(lines[0]).map(h => h.toLowerCase().replace(/[^a-z0-9]/g,''));
  const fi = (...keys) => { for (const k of keys) { const i = header.findIndex(h => h.includes(k)); if (i >= 0) return i; } return -1; };
  const idx = {
    container:   fi('container','containerid','box','bin','location'),
    description: fi('description','desc','item','name'),
    category:    fi('category','categ','cat','type'),
    area:        fi('area','zone','room'),
    brand:       fi('brand','make'),
    model:       fi('model','modelnum','part'),
    qty:         fi('qty','quantity','count'),
    value:       fi('estvalue','value','est','price','cost'),
    notes:       fi('notes','note','comment'),
  };
  return lines.slice(1).map((line, i) => {
    if (!line.trim()) return null;
    const c = parseLine(line);
    const g = k => (idx[k] >= 0 && c[idx[k]] !== undefined) ? c[idx[k]].trim() : '';
    const desc = g('description');
    if (!desc) return null;
    return { id: Date.now()+i, containerID:g('container'), description:desc, category:g('category'),
      area:g('area'), brand:g('brand'), modelNum:g('model'), qty:g('qty')||'1', estValue:g('value'), notes:g('notes') };
  }).filter(Boolean);
}

function mergeAndCommit(parsed) {
  if (!parsed.length) {
    showToast('No items found — check that the file has a Description column', 'err'); return;
  }
  const existing = state.items;
  const key = it => (it.description||'').toLowerCase().trim() + '||' + (it.containerID||'').toLowerCase().trim();
  const existingKeys = new Set(existing.map(key));
  const newItems = parsed.filter(it => !existingKeys.has(key(it)));
  const dupes = parsed.length - newItems.length;
  commit([...existing, ...newItems]);
  state.showImport = false;
  render();
  let msg = 'Imported ' + newItems.length + ' new item' + (newItems.length !== 1 ? 's' : '');
  if (dupes > 0) msg += ' (' + dupes + ' duplicate' + (dupes !== 1 ? 's' : '') + ' skipped)';
  showToast(msg);
}

function readFile(file) {
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();

  // Excel: use SheetJS
  if (ext === 'xlsx' || ext === 'xls') {
    if (typeof XLSX === 'undefined') {
      showToast('Excel library not loaded — check your connection and try again', 'err'); return;
    }
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const wb = XLSX.read(e.target.result, { type: 'array' });
        const ws = wb.Sheets[wb.SheetNames[0]];
        const csvText = XLSX.utils.sheet_to_csv(ws);
        mergeAndCommit(parseCSV(csvText));
      } catch(err) {
        showToast('Could not read Excel file — ' + err.message, 'err');
      }
    };
    reader.onerror = () => showToast('File read failed — try again', 'err');
    reader.readAsArrayBuffer(file);
    return;
  }

  // CSV / TXT
  if (ext === 'csv' || ext === 'txt') {
    const reader = new FileReader();
    reader.onload = e => mergeAndCommit(parseCSV(e.target.result));
    reader.onerror = () => showToast('File read failed — try again', 'err');
    reader.readAsText(file);
    return;
  }

  showToast('Unsupported file type — use .xlsx, .xls, or .csv', 'err');
}

// ── Sorting & Filtering ────────────────────────────────────────────────────
function getSorted(items, sortF, sortD) {
  return [...items].sort((a,b) => {
    const av = (a[sortF]||'').toString().toLowerCase();
    const bv = (b[sortF]||'').toString().toLowerCase();
    return sortD === 'asc' ? av.localeCompare(bv) : bv.localeCompare(av);
  });
}

function getFiltered() {
  return state.items.filter(it => {
    if (state.searchQ && !matchesItem(it, state.searchQ)) return false;
    if (state.fContainer && it.containerID !== state.fContainer) return false;
    if (state.fCategory && it.category !== state.fCategory) return false;
    return true;
  });
}

// ── Actions ────────────────────────────────────────────────────────────────
function doDelete(id) {
  commit(state.items.filter(it => it.id !== id));
  state.confirmDel = null;
  showToast('Item removed', 'err');
  render();
}

function doBulkDelete(ids) {
  const n = ids.size;
  commit(state.items.filter(it => !ids.has(it.id)));
  state.selected = new Set();
  state.removeSelected = new Set();
  state.confirmDel = null;
  showToast('Removed ' + n + ' items', 'err');
  render();
}

function submitForm() {
  if (!state.form.description.trim()) { showToast('Description is required', 'err'); return; }
  if (state.editId !== null) {
    commit(state.items.map(it => it.id === state.editId ? {...it, ...state.form} : it));
    showToast('Item updated');
    state.editId = null;
  } else {
    commit([...state.items, {id: Date.now(), ...state.form}]);
    showToast('Item added');
  }
  state.form = {...EMPTY_FORM};
  state.tab = 'search';
  render();
}

// ── RENDER ────────────────────────────────────────────────────────────────
function esc(s) {
  return (s||'').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function editItem(id) {
  const item = state.items.find(i => i.id === id);

  state.form = {
    containerID: item.containerID || '',
    description: item.description || '',
    category:    item.category    || '',
    area:        item.area        || '',
    brand:       item.brand       || '',
    modelNum:    item.modelNum    || '',
    qty:         item.qty         || '1',

  render();
}

              style="width:54px;background:var(--bg3);border:1px solid var(--bd);border-radius:4px;color:var(--tx);font-family:'DM Mono',monospace;font-size:13px;padding:3px 5px;text-align:center;"
              id="rmqty-${item.id}"
              oninput="(function(el,id){const v=parseInt(el.value)||0;state.removeQty[id]=v>0?v:undefined;render();})(this,${item.id})"
              onkeydown="if(event.key==='Enter'){subtractQty(${item.id});}">
          </td>
          <td style="text-align:center;font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:${remainColor}">${remainLabel}</td>
          <td>
            <button class="act del" style="opacity:${toRemove>0?'1':'0.3'}"
              ${toRemove>0?`onclick="subtractQty(${item.id})"`:''}>✓</button>
          </td>
        </tr>`;
      });
    }
    html += `</tbody></table></div></div>`;
  }

  // ── CONFIRM MODAL ──
  if (confirmDel !== null) {
    const isBulk = confirmDel === 'bulk' || confirmDel === 'remove-bulk';
    const bulkIds = confirmDel === 'bulk' ? selected : removeSelected;
    const itemName = !isBulk ? (items.find(i => i.id === confirmDel)?.description || '') : '';
    html += `
    <div class="overlay" onclick="state.confirmDel=null;render()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-title">Remove Item${isBulk?'s':''}</div>
        <div class="modal-body">
          ${isBulk
            ? `Remove ${bulkIds.size} selected items? This cannot be undone.`
            : `Remove &quot;${esc(itemName)}&quot;? This cannot be undone.`}
        </div>
        <div class="modal-acts">
          <button class="btn-ghost" onclick="state.confirmDel=null;render()">Cancel</button>
          <button class="btn-del" onclick="${isBulk
            ? `doBulkDelete(${confirmDel==='bulk'?'state.selected':'state.removeSelected'})`
            : `doDelete(${confirmDel})`}">Remove</button>
        </div>
      </div>
    </div>`;
  }

  // ── TOAST ──
  if (toast) {
    html += `<div class="toast ${toast.type}">${esc(toast.msg)}</div>`;
  }

  const prevFocus = document.activeElement && document.activeElement.id;
  document.getElementById('app').innerHTML = html;
  if (prevFocus === 'main-search' || prevFocus === 'remove-search') {
    const el = document.getElementById(prevFocus);
    if (el) { el.focus(); const len = el.value.length; el.setSelectionRange(len, len); }
  } else if (prevFocus && (prevFocus.startsWith('qty-') || prevFocus.startsWith('rmqty-'))) {
    const el = document.getElementById(prevFocus);
    if (el) { el.focus(); el.select(); }
  }
}
</script>
</body>
</html>
